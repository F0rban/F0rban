<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Tesson</title>
  <meta name="description" content="Il manque un carreau à ce mur. Retour à la manufacture.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1B1411">
  <!-- Page d'erreur servie à n'importe quelle profondeur d'URL : chemins absolus. -->
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/fonts.css">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    body { background: var(--tenmoku); color: var(--lait); min-height: 100svh; display: grid; grid-template-rows: auto 1fr; }
    .entete-404 { display: flex; align-items: center; min-height: var(--entete-h); padding: 0 var(--marge); }
    .page-404 { display: grid; align-content: center; justify-items: start; gap: 1.6rem; padding: 3rem var(--marge) 5rem; }
    .mur-404 { --cols: 3; --joint-l: 3px; width: min(100%, 22rem); border-radius: 3px; background: var(--tenmoku-2); }
    .mur-404 i.manque { background: var(--tenmoku); box-shadow: inset 0 0 0 1px var(--tenmoku-2); }
    .page-404 .titre { max-width: 12ch; }
    .page-404 p { color: var(--lait-2); max-width: 40ch; }
    .btn-lait:focus-visible { outline-color: var(--lait); }
  </style>
</head>
<body>
  <header class="entete-404">
    <a class="marque" href="/" aria-label="Tesson — accueil">Tesson</a>
  </header>
  <main class="page-404" id="contenu">
    <div class="mur mur-404" data-email="gotteron" aria-hidden="true">
      <i style="--dh:-1.2;--ds:0%;--dl:-0.8%;--hx:30%;--hy:22%;--g:.2"></i><i style="--dh:1.4;--ds:1%;--dl:1.2%;--hx:38%;--hy:26%;--g:.24"></i><i style="--dh:0.6;--ds:-1%;--dl:2.4%;--hx:34%;--hy:30%;--g:.18"></i><i style="--dh:-0.4;--ds:2%;--dl:-1.6%;--hx:28%;--hy:20%;--g:.22"></i><i class="manque"></i><i style="--dh:0.9;--ds:0%;--dl:0.4%;--hx:36%;--hy:24%;--g:.21"></i>
    </div>
    <p class="eyebrow" style="margin:0">Erreur 404</p>
    <h1 class="titre">Il manque un carreau à ce mur.</h1>
    <p>La page que vous cherchez n’existe pas, ou n’existe plus. Le reste du mur tient très bien.</p>
    <a class="btn btn-lait" href="/">Retour à la manufacture</a>
  </main>
</body>
</html>
